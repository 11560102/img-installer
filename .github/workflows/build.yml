name: "Build Armbian Installer ISO"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "版本类型"
        required: true
        default: "standard"
        type: choice
        options:
          - "standard"
          - "debian13_minimal"
          - "ubuntu24_minimal"
          - "ubuntu26_minimal"

jobs:
  build-release:
    runs-on: ubuntu-22.04
    env:
      VERSION_TYPE: ${{ github.event.inputs.version_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: ./build.sh

      - name: "Prepare Release Assets"
        run: |
          case "$VERSION_TYPE" in
            debian13_minimal)
              mv output/armbian-installer-x86_64-standard.iso output/armbian-installer-x86_64-debian13_minimal.iso
              ;;
            ubuntu24_minimal)
              mv output/armbian-installer-x86_64-standard.iso output/armbian-installer-x86_64-ubuntu24_minimal.iso
              ;;
            ubuntu26_minimal)
              mv output/armbian-installer-x86_64-standard.iso output/armbian-installer-x86_64-ubuntu26_minimal.iso
              ;;
            standard)
              # 默认名称无需修改
              ;;
            *)
              echo "未知版本类型: $VERSION_TYPE"
              exit 1
              ;;
          esac

      - name: "Publish"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "Armbian-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/info.md
          files: output/armbian-installer-x86_64-${{ github.event.inputs.version_type }}.iso
          token: ${{ secrets.GITHUB_TOKEN }}
